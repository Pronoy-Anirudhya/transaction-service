# transaction-service configuration (spec 12). Property names follow the spec exactly; container
# host names can be overridden by environment variables. Secrets have NO default (NFR-09): set
# TXN_DB_PASSWORD, RABBIT_USER, RABBIT_PASSWORD, QUOTE_SIGNING_KEY and API_KEY (see .env.example).

spring.application.name=transaction-service
server.port=8080
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.mime-mappings.yaml=application/yaml
spring.mvc.problemdetails.enabled=true

# --- PostgreSQL (P5, P6) ---------------------------------------------------------------------
spring.datasource.url=${TXN_DB_URL:jdbc:postgresql://postgres:5432/txn_db?reWriteBatchedInserts=true}
spring.datasource.username=${TXN_DB_USER:txn}
spring.datasource.password=${TXN_DB_PASSWORD}
# P6: small fixed pool (~2x the database's cores, 20 per instance), fail fast when exhausted.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=250
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.pool-name=txn-db
spring.flyway.enabled=true

# --- RabbitMQ (spec 9) -----------------------------------------------------------------------
spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.cache.channel.size=64

# --- Ledger client (spec 8.3) ----------------------------------------------------------------
# ledger-service is a separate service (spec 7.2); point LEDGER_BASE_URL at it (spec 12 uses http://haproxy:8090).
poc.ledger.base-url=${LEDGER_BASE_URL:http://localhost:8081}
poc.ledger.connect-timeout=100ms
poc.ledger.read-timeout=1200ms
poc.ledger.total-budget=3s
poc.ledger.max-retries=2
poc.ledger.retry.initial-delay=50ms
poc.ledger.retry.multiplier=2
poc.ledger.retry.jitter=20ms
poc.ledger.concurrency-limit=512
# ledger-service runs separately: its readiness is probed so outages answer 503 LEDGER_UNAVAILABLE at once.
poc.ledger.health-interval=2s
poc.ledger.accounts.fee-income=00000000-0000-0000-0000-0000000000c8
poc.ledger.accounts.vat-payable=00000000-0000-0000-0000-0000000000d2
poc.ledger.accounts.commission-payable=00000000-0000-0000-0000-0000000000dc
poc.ledger.accounts.issuance=00000000-0000-0000-0000-000000000384

# --- Business rules, quote, caches (FR-01, P8) -----------------------------------------------
poc.business.zone=Asia/Dhaka
poc.quote.ttl=5m
poc.quote.signing-key=${QUOTE_SIGNING_KEY}
poc.cache.wallet.ttl=10s
poc.cache.wallet.max-size=500000
poc.cache.rules.refresh=60s

# --- Posting endpoint bulkhead (P10) ---------------------------------------------------------
poc.api.send-money-concurrency-limit=1024

# --- Repair worker (spec 8.4) ----------------------------------------------------------------
poc.repair.interval=1s
poc.repair.batch-size=200
poc.repair.lease=30s
poc.repair.min-age=3s
poc.repair.unknown-recheck=2s
poc.repair.initial-backoff=1s
poc.repair.max-backoff=60s
poc.repair.alert-after-attempts=10
poc.repair.parallelism=32

# --- Events (spec 9) -------------------------------------------------------------------------
poc.events.exchange=mfs.transactions
poc.events.confirm-timeout=5s
poc.events.flush-interval=100ms
poc.events.flush-batch-size=500
poc.events.republish.interval=5s
poc.events.republish.batch-size=500
poc.events.republish.min-age=10s
poc.events.republish.lease=30s

# --- Reconciliation (FR-08) ------------------------------------------------------------------
poc.reconciliation.max-rows=10000
poc.reconciliation.parallelism=16

# --- Security (NFR-09) -----------------------------------------------------------------------
poc.security.api-key=${API_KEY}

# --- Contract and Swagger UI -----------------------------------------------------------------
# Swagger UI renders the authored contract served at GET /openapi.yaml. springdoc's own
# /v3/api-docs must stay enabled: in springdoc 3.1 springdoc.api-docs.enabled=false also removes
# Swagger UI (SwaggerConfig is conditional on SpringDocConfiguration).
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# --- Observability (spec 12, NFR-08) ---------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Component statuses (db, rabbit, ledger) are visible; details stay hidden.
management.endpoint.health.show-components=always
# Readiness = PostgreSQL reachable. RabbitMQ is excluded on purpose: a broker outage never affects
# money (F9), so it must not take the instance out of rotation.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.sendmoney.duration=true
management.metrics.distribution.percentiles-histogram.ledger.posting.duration=true
management.tracing.sampling.probability=0.1
# Metrics are scraped by Prometheus; OTLP metric push is off unless enabled explicitly. Traces are
# exported only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set.
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}

# JSON console logs (P15); the async appender and MDC fields are configured in logback-spring.xml.
logging.structured.format.console=ecs
