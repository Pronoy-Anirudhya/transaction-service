# transaction-service POC broker settings. Mounted as /etc/rabbitmq/conf.d/20-poc.conf, so the
# image's own 10-defaults.conf (console logging) still applies.

# Import users, the vhost, the exchanges (mfs.transactions + DLX), the demo quorum queue and its
# binding on every boot (spec 9). Because definitions are imported, RabbitMQ does NOT create the
# default guest user: the users come from definitions.json (local-dev passwords only).
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

# Resource alarms sized for a developer machine; production sets these per host.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB
