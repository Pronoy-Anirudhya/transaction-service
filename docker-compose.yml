# transaction-service local stack: the service with its own PostgreSQL and RabbitMQ.
#
#   docker compose up -d --build
#
# ledger-service is NOT part of this stack: it runs as a separate service (its own repository and
# Compose file, with TigerBeetle). transaction-service reaches it at LEDGER_BASE_URL, by default the
# ledger published on this host's port 8081. If the ledger is not running, transaction-service
# still starts; ledger-dependent requests answer 503 LEDGER_UNAVAILABLE until it is back (README).
#
# Credentials below are local-development defaults only (override them in .env, see
# .env.example). The RabbitMQ users are defined in deploy/rabbitmq/definitions.json.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: txn_db
      POSTGRES_USER: txn
      POSTGRES_PASSWORD: ${TXN_DB_PASSWORD:-txn-local-dev}
    # Spec 12: shared_buffers ~25% of RAM (override PG_SHARED_BUFFERS on the reference host),
    # max_connections sized for 2 instances x 20 connections + Flyway, tooling and headroom.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - max_connections=200
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - autovacuum_naptime=10s
    shm_size: 256m
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker: mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txn -d txn_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "${RABBIT_PORT:-5672}:5672"
      - "${RABBIT_MGMT_PORT:-15672}:15672"
    volumes:
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-poc.conf:ro
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # --- the service ---------------------------------------------------------------------------
  transaction-service:
    build: .
    image: transaction-service:local
    ports:
      - "${TXN_PORT:-8080}:8080"
    environment:
      # "test" enables the support endpoints (register / fund wallet) for demos.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      # The separately run ledger-service (published on the host's port 8081 by default).
      LEDGER_BASE_URL: ${LEDGER_BASE_URL:-http://host.docker.internal:8081}
      TXN_DB_URL: jdbc:postgresql://postgres:5432/txn_db?reWriteBatchedInserts=true
      TXN_DB_USER: txn
      TXN_DB_PASSWORD: ${TXN_DB_PASSWORD:-txn-local-dev}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER:-txn}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-txn-local-dev}
      API_KEY: ${API_KEY:-local-dev-api-key}
      QUOTE_SIGNING_KEY: ${QUOTE_SIGNING_KEY:-local-dev-quote-signing-key-change-me-0123456789}
    # Makes host.docker.internal resolve on Linux as it does on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
